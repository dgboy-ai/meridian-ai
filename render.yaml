services:
  - type: web
    name: meridian-ai-backend
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATAHUB_MOCK
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PORT
        value: "8000"
    healthCheckPath: /health
    autoDeploy: true
